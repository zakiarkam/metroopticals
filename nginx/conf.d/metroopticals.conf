# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name metroopticals.lk www.metroopticals.lk;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name metroopticals.lk www.metroopticals.lk;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/metroopticals.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metroopticals.lk/privkey.pem;

    # SSL configuration (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root and access logs
    access_log /var/log/nginx/metroopticals_access.log main;
    error_log /var/log/nginx/metroopticals_error.log warn;

    # Cache static assets (proxy to Next.js app)
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://metroopticals_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public folder assets (proxy to Next.js app)
    location /images {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://metroopticals_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache image optimization
    location /_next/image {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://metroopticals_backend;
        proxy_cache_valid 200 1h;
    }

    # Rate limiting for general traffic
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        
        proxy_pass http://metroopticals_backend;
        proxy_http_version 1.1;

        # Headers for backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Keep-alive
        proxy_set_header Connection "";
    }

    # Rate limiting for API endpoints
    location ~ ^/api/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://metroopticals_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # No buffering for API responses (real-time)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (don't log)
    location /api/health {
        proxy_pass http://metroopticals_backend;
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
