name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          [ -f docker/Dockerfile ]       || (echo "❌ docker/Dockerfile missing";       exit 1)
          [ -f package.json ]            || (echo "❌ package.json missing";            exit 1)
          [ -f prisma/schema.prisma ]    || (echo "❌ prisma/schema.prisma missing";    exit 1)
          [ -f next.config.mjs ]         || (echo "❌ next.config.mjs missing";         exit 1)
          echo "✅ Project structure valid"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Check for critical file changes
        id: dockerfile-check
        run: |
          BEFORE="${{ github.event.before }}"
          # Handle first push to a new branch — before SHA is all zeros
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            echo "dockerfile_changed=true" >> $GITHUB_OUTPUT
            echo "⚠️ First push to branch — cache cleared"
          elif git diff --name-only ${BEFORE} ${{ github.sha }} | grep -qE '^(docker/Dockerfile|package.*json|prisma/)'; then
            echo "dockerfile_changed=true" >> $GITHUB_OUTPUT
            echo "⚠️ Critical files changed — cache cleared"
          else
            echo "dockerfile_changed=false" >> $GITHUB_OUTPUT
            echo "✅ Using Docker layer cache"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.dockerfile-check.outputs.dockerfile_changed == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ steps.dockerfile-check.outputs.dockerfile_changed == 'true' }}

      - name: Verify image pushed
        run: |
          echo "🐳 Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"