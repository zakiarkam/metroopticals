name: Deploy develop to VPS (3001) AFTER build

on:
  workflow_run:
    workflows:
      - Build & Push Docker Image
    types:
      - completed

jobs:
  deploy-dev:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync nginx config to VPS
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          echo "📁 Syncing nginx configuration to VPS..."

          ssh -i ~/.ssh/id_ed25519 -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" <<'SSHEOF'
            set -euo pipefail
            mkdir -p ~/metroopticals/nginx/conf.d
            mkdir -p ~/metroopticals/docker

            if [ -d ~/metroopticals/nginx/nginx.conf ]; then
              echo "⚠️ nginx.conf is a directory, removing..."
              rm -rf ~/metroopticals/nginx/nginx.conf
            fi

            if [ -d ~/metroopticals/nginx/conf.d ]; then
              rm -rf ~/metroopticals/nginx/conf.d/*
            fi

            echo "✅ Directories prepared"
          SSHEOF

          scp -i ~/.ssh/id_ed25519 -P "${SSH_PORT}" \
            ./nginx/nginx.conf \
            "${SSH_USERNAME}@${SSH_HOST}:~/metroopticals/nginx/nginx.conf"

          scp -i ~/.ssh/id_ed25519 -P "${SSH_PORT}" -r \
            ./nginx/conf.d/* \
            "${SSH_USERNAME}@${SSH_HOST}:~/metroopticals/nginx/conf.d/"

          scp -i ~/.ssh/id_ed25519 -P "${SSH_PORT}" \
            ./docker/docker-compose.prod.yml \
            "${SSH_USERNAME}@${SSH_HOST}:~/metroopticals/docker/docker-compose.prod.yml"

          echo "✅ Config files synced"

      - name: Deploy to VPS
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          TAG="sha-${SHA}"

          echo "📦 Deploying image tag: ${TAG}"

          ssh -i ~/.ssh/id_ed25519 -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" \
            bash -s -- "${TAG}" "${GHCR_PAT}" "${GHCR_USERNAME}" <<'EOF'
          set -euo pipefail

          TAG="$1"
          GHCR_PAT="$2"
          GHCR_USERNAME="$3"

          cd ~/metroopticals/docker
          COMPOSE_FILE=~/metroopticals/docker/docker-compose.prod.yml

          echo "🔐 Logging into GHCR..."
          echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          echo "📥 Pulling latest image..."
          max_attempts=5
          for i in $(seq 1 "${max_attempts}"); do
            if IMAGE_TAG="${TAG}" docker compose -f "${COMPOSE_FILE}" pull; then
              echo "✅ Image pull succeeded"
              break
            fi

            if [ "${i}" -eq "${max_attempts}" ]; then
              echo "❌ Image pull failed after ${max_attempts} attempts"
              exit 1
            fi

            echo "⚠️ Pull failed, retrying in 30s... (attempt ${i}/${max_attempts})"
            sleep 30
          done

          docker rm -f metroopticals-app-3001 >/dev/null 2>&1 || true
          docker rm -f metroopticals-nginx >/dev/null 2>&1 || true

          echo "🔄 Starting containers..."
          IMAGE_TAG="${TAG}" docker compose -f "${COMPOSE_FILE}" up -d --force-recreate --wait

          echo "✅ Deployment verification..."
          docker ps --filter name=metroopticals-app-3001 --format "{{.Names}}\t{{.Status}}"

          echo "🏥 Final health check via host port..."
          for i in {1..15}; do
            if curl -fs http://127.0.0.1:3001/api/health > /dev/null; then
              echo "✅ Application is healthy"
              exit 0
            fi
            echo "⏳ Waiting... (${i}/15)"
            sleep 5
          done

          echo "❌ Health check failed — dumping container logs:"
          docker logs metroopticals-app-3001 --tail 50
          exit 1
          EOF

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Deployment ${{ job.status }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *Metro Opticals Deploy ${{ job.status }}*
                    Branch: `develop`
                    SHA: `${{ github.event.workflow_run.head_sha }}`